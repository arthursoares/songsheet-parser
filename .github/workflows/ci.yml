name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PEP 735 dependency groups need pip >= 25.1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Ruff lint
        run: ruff check scripts/ tests/

      - name: Ruff format check
        run: ruff format --check scripts/ tests/

      - name: Python tests
        run: python -m pytest -q

      - name: JS tests (doc ops, dictionary, chord-naming parity)
        run: node --test "tests/js/*.test.js"

  container:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/arthursoares/songsheet-qa-private
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build QA image
        run: |
          docker build --pull --platform "linux/$TARGET_ARCH" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag songsheet-qa:ci .

      - name: Smoke test QA image
        run: tests/smoke_qa_container.sh songsheet-qa:ci

      - name: Publish tested architecture image
        if: github.repository == 'arthursoares/songsheet-parser' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.SONGSHEET_GHCR_TOKEN }}
        run: |
          python3 tests/check_qa_registry_privacy.py "$IMAGE"
          : "${GHCR_TOKEN:?Add the SONGSHEET_GHCR_TOKEN Actions secret with write:packages}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username arthursoares --password-stdin
          if ! docker buildx imagetools inspect "$IMAGE:private-bootstrap" >/dev/null; then
            echo "::error::Bootstrap the private QA package before uploading application images."
            exit 1
          fi
          tag="$IMAGE:sha-$GITHUB_SHA-$TARGET_ARCH"
          docker tag songsheet-qa:ci "$tag"
          docker push "$tag"

  publish-container:
    needs: container
    if: github.repository == 'arthursoares/songsheet-parser' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: songsheet-qa-ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/arthursoares/songsheet-qa-private
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish both architectures under one tag
        env:
          GHCR_TOKEN: ${{ secrets.SONGSHEET_GHCR_TOKEN }}
        run: |
          python3 tests/check_qa_registry_privacy.py "$IMAGE"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username arthursoares --password-stdin
          tag="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$tag" "$tag-amd64" "$tag-arm64"
          docker buildx imagetools inspect --raw "$tag" | jq -e \
            '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64","arm64"]'

      - name: Verify anonymous registry pulls are denied
        run: |
          python3 tests/check_qa_registry_privacy.py "$IMAGE" "sha-$GITHUB_SHA"

      - name: Promote latest when this commit is still on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
            published=$(docker buildx imagetools inspect --raw "$IMAGE:latest")
            tested=$(docker buildx imagetools inspect --raw "$IMAGE:sha-$GITHUB_SHA")
            test "$published" = "$tested"
            python3 tests/check_qa_registry_privacy.py "$IMAGE" latest
          fi
