<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Songsheet QA</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/material-darker.min.css">
<link rel="stylesheet" href="vendor/codemirror/lint.min.css">
<style>
  :root{
    --bg:#0f1115; --bg-deep:#0c0e12; --panel:#171a21; --panel-2:#1e222b;
    --field:#11141b; --border:#2a2f3a; --border-2:#48515f;
    --text:#e6e8ee; --muted:#9aa3b2; --accent:#6ea8fe; --accent-ink:#06132b;
    --sel:#2d3b5a; --chip:#222836;
    --ok-bg:#10271a; --ok:#3fb950; --bad-bg:#2b1416; --bad:#f85149;
    --note:#7fb3a0; --civ:#9d8df1; --iv:#c8a26b; --paper:#fff;
    /* Harmony tab function colors (ported from the harmonic-analysis prototype) */
    --fn-tonic:#3fb950; --fn-subdominant:#6ea8fe; --fn-dominant:#f0883e;
    --fn-secondary:#9d8df1; --fn-passing:#5bb3a6; --fn-chromatic:#8a93a3;
    --fn-chrombass:#c8a26b;
  }
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  .muted{color:var(--muted);font-size:12px}
  .btn-primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer}
  .hidden{display:none}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header select{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px}
  header .spacer{flex:1}
  .layout{display:grid;grid-template-columns:230px 1fr 1fr;height:calc(100vh - 49px)}
  /* focus mode: hide the PDF-scan pane and/or the song list */
  .layout.no-pages{grid-template-columns:230px 1fr}
  .layout.no-pages .col.left{display:none}
  .layout.no-songs{grid-template-columns:1fr 1fr}
  .layout.no-songs .col.songs{display:none}
  .layout.no-pages.no-songs{grid-template-columns:1fr}
  .col{overflow:auto;padding:14px}
  .col.left{border-right:1px solid var(--border);background:var(--bg-deep)}
  /* Songs sidebar */
  .col.songs{border-right:1px solid var(--border);background:var(--bg-deep);padding:10px}
  .songs-tools{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;position:sticky;top:-10px;background:var(--bg-deep);padding-top:4px;z-index:1}
  .songs-tools input[type=text]{width:100%;box-sizing:border-box;background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px}
  .songs-filter{display:flex;gap:4px;flex-wrap:wrap}
  .songs-filter button{flex:1;background:var(--panel-2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 2px;cursor:pointer;font-size:11px}
  .songs-filter button.active{background:var(--sel);color:var(--text);border-color:var(--accent)}
  .songs-list{display:flex;flex-direction:column;gap:3px}
  .song-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid transparent;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.25}
  .song-row:hover{background:var(--panel)}
  .song-row.sel{background:var(--sel);border-color:var(--accent)}
  .song-row .sg{width:14px;text-align:center;flex:0 0 auto;color:var(--muted)}
  .song-row .snm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .songs-empty{color:var(--muted);font-size:12px;padding:12px 6px}
  /* Songs sidebar footer: provenance + per-song note */
  .songs-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
  .provenance{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:14px}
  .note-lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .song-note{width:100%;box-sizing:border-box;min-height:60px;resize:vertical;background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .song-note:disabled{opacity:.5}
  /* Structural editing controls (Bars view) */
  .section-label{display:flex;align-items:center;gap:8px}
  .section-label .seclabel{flex:1;min-width:0;background:var(--field);border:1px solid transparent;color:var(--text);border-radius:5px;padding:3px 6px;font:inherit;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
  .section-label .seclabel:hover{border-color:var(--border)}
  .section-label .seclabel:focus{border-color:var(--accent);outline:none}
  .secmv,.barmv{display:flex;gap:4px;flex:0 0 auto}
  .secmv button,.barmv button{background:var(--field);border:1px solid var(--border);color:var(--muted);border-radius:4px;cursor:pointer;font-size:11px;padding:2px 7px;line-height:1.4}
  .secmv button:hover:not(:disabled),.barmv button:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
  .secmv button:disabled,.barmv button:disabled{opacity:.3;cursor:default}
  .barhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .barhead .barnum{margin-bottom:0}
  .barmv{margin-left:auto}
  .sec-empty{display:flex;align-items:center;gap:10px;border:1px dashed var(--border);border-radius:8px;padding:8px;margin-bottom:8px}
  .sec-empty .barAddFirst{background:var(--field);border:1px solid var(--border);color:var(--muted);border-radius:4px;cursor:pointer;font-size:11px;padding:2px 7px}
  .sec-empty .barAddFirst:hover{border-color:var(--accent);color:var(--text)}
  /* Review tab */
  .review-empty{color:var(--ok);font-size:14px;padding:24px 4px}
  .rev-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer;background:var(--panel)}
  .rev-row:hover{border-color:var(--accent)}
  .rev-row .rnm{font-weight:600}
  .rev-row .rwhere{color:var(--muted);font-size:12px}
  .rev-row .rwhy{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bad-bg);color:var(--bad)}
  .kbdhint{cursor:help;color:var(--muted);font-size:12px;border:1px solid var(--border);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
  .col.left img{width:100%;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--paper)}
  .pagecap{color:var(--muted);font-size:12px;margin-bottom:12px}
  .empty{color:var(--muted);font-size:13px;padding:24px 4px}
  .section-label{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin:16px 0 8px}
  .bar{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel)}
  .barnum{color:var(--muted);font-size:11px;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--chip);border:1px solid var(--border);border-radius:7px;padding:6px 9px;cursor:pointer;min-width:60px}
  .chip:hover{border-color:var(--accent)}.chip.sel{background:var(--sel);border-color:var(--accent)}
  .chip .nm{font-weight:600}.chip.pct .nm{color:var(--accent)}
  .chip .vc{font:11px ui-monospace,monospace;color:var(--muted)}
  .chip .nt{font:11px ui-monospace,monospace;color:var(--note)}
  .chip .ci{font:11px ui-monospace,monospace;color:var(--civ)}
  .chip .iv{font:11px ui-monospace,monospace;color:var(--iv)}
  .dhead .dci{font:11px ui-monospace,monospace;color:var(--civ)}
  .dhead .div{font:11px ui-monospace,monospace;color:var(--iv)}
  .chip .tx{font-size:12px;opacity:.85}
  .chip .mv{display:flex;gap:4px;margin-top:5px}
  .chip .mv button{flex:1;background:var(--field);border:1px solid var(--border);color:var(--muted);border-radius:4px;cursor:pointer;font-size:12px;line-height:1.4}
  .chip .mv button:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
  .chip .mv button:disabled{opacity:.3;cursor:default}
  .chip .cdia{display:block;margin:3px 0}
  .dhead .cdia{vertical-align:middle}
  .chip .warn{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:5px}
  .editor{position:fixed;right:0;top:49px;bottom:0;width:360px;background:var(--panel-2);border-left:1px solid var(--border);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .15s}
  .editor.open{transform:none}
  .editor h2{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
  .editor label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  .editor input[type=text]{width:100%;background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px}
  .err{color:var(--bad);font-size:12px;min-height:16px;margin-top:4px}
  .badge{display:inline-flex;gap:6px;font-size:12px;padding:3px 8px;border-radius:20px;margin-top:6px}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
  .suggest .s{display:flex;justify-content:space-between;padding:6px 8px;border:1px solid var(--border);border-radius:6px;margin:5px 0;cursor:pointer}
  .suggest .s:hover{border-color:var(--accent)}
  .fb-ctl{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
  .fb-ctl button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:5px;width:24px;height:24px;cursor:pointer}
  .fb-grid{display:flex;gap:0;justify-content:center;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:10px}
  .fb-col{display:flex;flex-direction:column;align-items:center;width:30px}
  .fb-mark{height:18px;font:13px ui-monospace,monospace;cursor:pointer}
  .fb-cell{width:28px;height:30px;border-top:1px solid var(--border-2);border-left:1px solid var(--border-2);cursor:pointer;position:relative}
  .fb-col:last-child .fb-cell{border-right:1px solid var(--border-2)}
  .fb-cell.on::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent)}
  .fb-lbl{font:10px ui-monospace,monospace;color:var(--muted);margin-top:4px}
  .fb-legend{width:22px}
  .fb-fretnum{height:30px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font:11px ui-monospace,monospace;color:var(--muted)}
  .fb-text{margin-top:10px}
  .fb-err{color:var(--bad);font-size:12px;min-height:16px;margin-top:4px}
  .fb-notes{color:var(--muted);font:12px ui-monospace,monospace;margin-top:6px}
  .viewtabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{background:var(--panel-2);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer}
  .tab.active{background:var(--sel);color:var(--text);border-color:var(--accent)}
  .pvctl{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .cmctl{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .cmsplit{display:flex;gap:8px;height:calc(100vh - 140px)}
  #cmSource{width:42%;height:100%;box-sizing:border-box;background:var(--bg-deep);color:#cfe3d8;border:1px solid var(--border);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,monospace;resize:none;white-space:pre;tab-size:2}
  #cmSource.hidden{display:none}
  #json{display:flex;flex-direction:column;height:calc(100vh - 100px)}
  #json .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  #jsonMsg.err{color:var(--bad)}
  #jsonMsg.ok{color:var(--ok)}
  #jsonSource{flex:1;width:100%;box-sizing:border-box;background:var(--bg-deep);color:#cfe3d8;border:1px solid var(--border);border-radius:8px;padding:10px;font:12px/1.55 ui-monospace,monospace;resize:none;white-space:pre;tab-size:2;overflow:auto}
  #previewFrame{flex:1;height:100%;border:1px solid var(--border);border-radius:8px;background:var(--paper)}
  .drow{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel)}
  .drow.sel{border-color:var(--accent)}
  .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
  .dhead .dnm{font-weight:700}
  .dhead .dvc{font:11px ui-monospace,monospace;color:var(--muted)}
  .dhead .dnt{font:11px ui-monospace,monospace;color:var(--note)}
  .dhead .dct{font-size:11px;color:var(--muted);margin-left:auto}
  .dhead .warn{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .dedit{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}
  .dedit input[type=text]{width:100%;background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px;margin-bottom:6px}
  .dsuggest .s{display:inline-block;border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;cursor:pointer;font-size:12px}
  .dsuggest .s:hover{border-color:var(--accent)}
  .dactions{display:flex;gap:8px;margin-top:8px}
  .dactions button{border-radius:6px;padding:7px 12px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
  .dactions .apply{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
  .dmergebar{position:sticky;top:0;background:var(--field);border:1px solid var(--accent);border-radius:8px;padding:8px;margin-bottom:8px;display:none}
  .dmergebar.show{display:block}
  .dmergeform{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .dmergeform input[type=text]{background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px}
  .dmergeform button{border-radius:6px;padding:6px 12px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
  .dmergeform button.apply{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
  .dsort{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px}
  .ed-actions{display:flex;gap:8px;margin-top:16px}
  .ed-actions button{flex:1;border-radius:6px;padding:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer}
  .ed-actions .apply{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
  /* JSON tab — CodeMirror editor (dark, palette-matched) */
  #jsonEditor{flex:1;min-height:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  #jsonEditor .CodeMirror{height:100%;font:12px/1.55 ui-monospace,monospace;background:var(--bg-deep);color:#cfe3d8}
  #jsonEditor .CodeMirror-gutters{background:var(--panel);border-right:1px solid var(--border)}
  #jsonEditor .CodeMirror-linenumber{color:var(--muted)}
  #jsonEditor .CodeMirror-cursor{border-left:1px solid var(--text)}
  #jsonEditor .CodeMirror-selected{background:var(--sel)}
  #jsonEditor .cm-string{color:#9ece6a}
  #jsonEditor .cm-number{color:#e0af68}
  #jsonEditor .cm-atom{color:#bb9af7}
  #jsonEditor .cm-property,#jsonEditor .cm-string.cm-property{color:#7aa2f7}
  #jsonEditor .cm-punctuation,#jsonEditor .cm-bracket{color:var(--muted)}
  #jsonEditor .CodeMirror-lint-marker-error{cursor:pointer}
  #jsonEditor .CodeMirror-lint-mark-error{text-decoration:wavy underline var(--bad)}
  #jsonEditor .CodeMirror-activeline-background{background:#1a1f29}
  /* Harmony tab — measures of function-colored chord cells + lanes + panel */
  #harmony{height:calc(100vh - 100px);overflow:auto;padding-bottom:40px}
  .hm-head{color:var(--muted);font-size:12px;margin-bottom:8px;line-height:1.6}
  .hm-keybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .hm-keybar:empty{display:none}
  .hm-keybar select{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px}
  .hm-keywarn{color:var(--fn-dominant);font-size:12px}
  .hm-legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .hm-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--panel-2);font-size:12px;color:var(--text);user-select:none;cursor:pointer}
  .hm-chip.dev{border-style:dashed}
  .hm-chip.active{outline:2px solid var(--accent);outline-offset:1px}
  .hm-sep{width:1px;background:var(--border);margin:0 4px;align-self:stretch}
  .hm-dot{width:9px;height:9px;border-radius:50%}
  .hm-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .hm-play{background:var(--fn-tonic);color:#08210e;border:1px solid var(--fn-tonic);border-radius:8px;padding:6px 16px;font-weight:700;font-size:14px;cursor:pointer;min-width:48px}
  .hm-play.playing{background:var(--panel-2);color:var(--text);border-color:var(--border)}
  .hm-tempo{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .hm-tempo input[type=range]{accent-color:var(--accent)}
  .hm-lanes{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 0 4px;margin-bottom:14px;position:relative}
  #hmCursorSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #hmCursorSvg line{stroke:#fff;stroke-width:1.4;opacity:.9}
  .hm-cell.cur{outline:2px solid #fff;outline-offset:1px;box-shadow:0 0 12px rgba(255,255,255,.25)}
  .hm-lane-title{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:0 14px;margin:6px 0 2px}
  .hm-lanes svg{display:block;width:100%}
  .hm-main{display:grid;grid-template-columns:1fr 270px;gap:12px;align-items:start}
  #hmScoreWrap{position:relative;padding-top:48px}
  #hmPanel{position:sticky;top:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;min-height:120px}
  .hm-bigsym{font-size:26px;font-weight:700}
  .hm-rompanel{font-size:15px;margin:2px 0 6px}
  .hm-whybox{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
  .hm-diagram{display:flex;justify-content:center;margin:8px 0 4px}
  .hm-diagram svg{transform:scale(1.7);transform-origin:top center;margin-bottom:34px}
  .hm-kv{display:flex;gap:8px;font-size:12px;margin:3px 0}
  .hm-kv .k{color:var(--muted);min-width:64px}
  .hm-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .hm-tag{font-size:10.5px;padding:2px 7px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2)}
  .hm-conf{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:12px}
  .hm-conf.high{background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.4)}
  .hm-conf.medium{background:rgba(154,163,178,.12);border:1px solid var(--border)}
  .hm-conf.low{background:rgba(240,136,62,.14);border:1px solid var(--fn-dominant)}
  .hm-bracket{position:absolute;border:1.6px solid;border-bottom:none;border-radius:5px 5px 0 0;height:11px;cursor:help;pointer-events:auto}
  .hm-blab{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1.2;white-space:nowrap;padding:0 3px;background:var(--bg);border-radius:3px}
  #hmTip{position:fixed;z-index:50;max-width:280px;background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .1s}
  .hm-dim{opacity:.13}
  .hm-section{margin-bottom:16px}
  .hm-seclabel{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:32px}
  /* the 44px row gap is the home of the device brackets between systems
     (sized for 3 stacked bracket lanes: chained ii-V-I cadences share cells) */
  .hm-bars{display:flex;flex-wrap:wrap;gap:44px 4px;align-items:stretch}
  .hm-bar{display:flex;align-items:stretch;gap:3px;padding:0 4px;border-left:2px solid var(--border)}
  .hm-bar:last-child{border-right:2px solid var(--border)}
  .hm-cell{position:relative;min-width:54px;padding:5px 7px 6px;border-radius:7px;border:1px solid transparent;background:var(--panel-2);display:flex;flex-direction:column;justify-content:flex-start}
  .hm-cell:hover{border-color:var(--border-2)}
  .hm-sym{font-weight:600;font-size:13px;white-space:nowrap}
  .hm-rom{font-size:10px;margin-top:1px}
  .hm-lyr{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
  .hm-cell.held{min-width:30px;opacity:.85;background:repeating-linear-gradient(90deg,var(--panel-2),var(--panel-2) 6px,#20242e 6px,#20242e 12px)}
  .hm-cell.held .hm-sym{color:var(--muted);font-style:italic}
  .hm-cell.lowconf{border:1px dashed var(--fn-dominant);opacity:.8}
  .hm-cell.lowconf::after{content:"?";position:absolute;top:2px;right:5px;color:var(--fn-dominant);font-size:10px;font-weight:700}
  .hm-cell.medconf{opacity:.88;border:1px dotted var(--border-2)}
  .hm-cell.selected{box-shadow:0 0 0 2px var(--accent) inset}
  .hm-fnbar{height:3px;border-radius:2px;margin-top:5px}
  /* Lyrics tab — chords-over-syllables, drag to re-anchor */
  #lyrics{height:calc(100vh - 100px);overflow:auto;padding-bottom:40px}
  .ly-hint{color:var(--muted);font-size:12px;margin-bottom:12px}
  .ly-section{margin-bottom:22px}
  .ly-seclabel{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin:0 0 10px}
  .ly-line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;line-height:2.6}
  .ly-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px}
  .ly-barsep{color:var(--border-2);font-size:18px;align-self:flex-end;margin:0 4px;user-select:none}
  /* a syllable column: chord token stacked above the syllable text */
  .ly-syl{position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;padding:0 2px;border-radius:5px;min-height:2.4em;justify-content:flex-end}
  .ly-syl.drop-ok{background:var(--sel);outline:1px dashed var(--accent)}
  .ly-chord{align-self:flex-start;font-weight:700;font-size:13px;color:var(--accent);background:var(--chip);border:1px solid var(--border);border-radius:6px;padding:0 6px;margin-bottom:2px;cursor:grab;user-select:none;line-height:1.5}
  .ly-chord.pct{color:var(--muted);opacity:.55;font-weight:500}
  .ly-chord:hover{border-color:var(--accent)}
  .ly-chord.dragging{opacity:.4}
  .ly-chord.inst{cursor:grab}
  .ly-chordrow-spacer{height:1.5em}
  .ly-text{font-size:15px;white-space:pre}
  .ly-text.empty{color:var(--muted)}
  .ly-inst{font-style:italic;color:var(--muted)}
</style>
</head>
<body>
<header>
  <select id="albumSel"></select>
  <select id="songSel" class="hidden"></select>
  <span id="albumProgress" class="muted"></span>
  <button id="nextFlagBtn" class="tab" title="jump to next flagged chord (])">Next flagged ›</button>
  <select id="keySel" title="song key (for interval analysis)">
    <option value="">key: —</option>
  </select>
  <select id="statusSel" title="editing status">
    <option value="pending">○ pending</option>
    <option value="in_progress">◐ in progress</option>
    <option value="done">✓ done</option>
  </select>
  <span id="flagCount" class="muted"></span>
  <button id="songsToggle" class="tab" title="show/hide the song list (focus mode)">☰ songs</button>
  <button id="scanToggle" class="tab" title="show/hide the PDF scan pane (\)">⊞ scan</button>
  <button id="spellToggle" title="toggle note spelling" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer">♯ sharp</button>
  <span class="spacer"></span>
  <span id="saveStatus" class="muted"></span>
  <span class="kbdhint" id="kbdHint" title="Keyboard shortcuts:&#10;⌘S / Ctrl+S — Save&#10;⌘Z / Ctrl+Z — Undo&#10;⌘⇧Z / Ctrl+Y — Redo&#10;Esc — close editor&#10;n / p — next / previous song&#10;] — next flagged chord&#10;\ — toggle PDF scan pane&#10;Enter (in name field) — Apply">?</span>
  <button id="saveBtn" class="btn-primary">Save song</button>
</header>
<div class="layout">
  <div class="col songs" id="songsPanel">
    <div class="songs-tools">
      <input type="text" id="songSearch" placeholder="search songs…" autocomplete="off">
      <div class="songs-filter" id="songsFilter">
        <button data-filter="all" class="active">All</button>
        <button data-filter="pending">○</button>
        <button data-filter="in_progress">◐</button>
        <button data-filter="done">✓</button>
      </div>
    </div>
    <div class="songs-list" id="songsList"></div>
    <div class="songs-foot">
      <div id="provenance" class="provenance"></div>
      <label class="note-lbl" for="songNote">note</label>
      <textarea id="songNote" class="song-note" placeholder="per-song note…"
                spellcheck="false" disabled></textarea>
    </div>
  </div>
  <div class="col left" id="pages"></div>
  <div class="col right">
    <div class="viewtabs">
      <button id="tabBars" class="tab active">Bars</button>
      <button id="tabLyrics" class="tab">Lyrics</button>
      <button id="tabReview" class="tab">Review</button>
      <button id="tabDict" class="tab">Dictionary</button>
      <button id="tabHarmony" class="tab">Harmony</button>
      <button id="tabPreview" class="tab">Preview</button>
      <button id="tabJson" class="tab">JSON</button>
    </div>
    <div id="bars"></div>
    <div id="lyrics" class="hidden"></div>
    <div id="review" class="hidden"></div>
    <div id="dict" class="hidden"></div>
    <div id="harmony" class="hidden">
      <div id="hmHead" class="hm-head"></div>
      <div id="hmKeybar" class="hm-keybar"></div>
      <div class="hm-toolbar">
        <button id="hmPlayBtn" class="hm-play" title="play the real voicings, beat-accurate">▶</button>
        <div class="hm-tempo">tempo
          <input type="range" id="hmTempo" min="50" max="200" value="110">
          <span id="hmTempoVal">110</span> bpm
        </div>
        <span id="hmAudioState" class="muted"></span>
        <span class="spacer" style="flex:1"></span>
        <button id="hmExportJson" class="tab" title="analysis of the CURRENT (unsaved) edits">Export JSON</button>
        <button id="hmExportCsv" class="tab" title="one row per chord event — for spreadsheets">Export CSV</button>
        <button id="hmExportHtml" class="tab" title="standalone snapshot of this view">Export HTML</button>
        <button id="hmExportPdf" class="tab" title="the snapshot converted by headless Chrome">Export PDF</button>
        <span id="hmExportMsg" class="muted"></span>
      </div>
      <div id="hmLegend"></div>
      <div class="hm-lanes">
        <div class="hm-lane-title">Tension contour (tonic → altered)</div>
        <svg id="hmTensionSvg" viewBox="0 0 1000 90" preserveAspectRatio="none" height="90"></svg>
        <div class="hm-lane-title">Bass line (chromatic descents read as staircases)</div>
        <svg id="hmBassSvg" viewBox="0 0 1000 70" preserveAspectRatio="none" height="70"></svg>
        <div class="hm-lane-title">Tonicization ribbon (local key region)</div>
        <svg id="hmRibbonSvg" viewBox="0 0 1000 26" preserveAspectRatio="none" height="26"></svg>
        <svg id="hmCursorSvg" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg>
      </div>
      <div class="hm-main">
        <div id="hmScoreWrap">
          <div id="hmBrackets"></div>
          <div id="hmScore"></div>
        </div>
        <div id="hmPanel"></div>
      </div>
      <div id="hmTip"></div>
    </div>
    <div id="preview" class="hidden">
      <div class="pvctl">
        <label>style
          <select id="pvStyle"><option value="fork">Fork</option><option value="target">Target</option></select>
        </label>
        <label>dictionary
          <select id="pvDict"><option value="per_voicing">per voicing</option><option value="per_name">per name</option></select>
        </label>
        <label>bars/line
          <select id="pvBars"><option>4</option><option>6</option><option>8</option></select>
        </label>
        <label><input type="checkbox" id="pvInline"> inline diagrams</label>
        <label><input type="checkbox" id="pvSource"> source</label>
        <span class="spacer" style="flex:1"></span>
        <button id="pvExportPdf" class="tab">Export PDF</button>
        <button id="pvExportPng" class="tab">Export PNG</button>
        <button id="pvExportHtml" class="tab">Export HTML</button>
        <button id="pvExportChordmark" class="tab">Export .chordmark</button>
        <button id="pvExportChordpro" class="tab">Export ChordPro</button>
        <button id="pvExportAlbum" class="tab">Export album PDF</button>
        <span id="pvExportMsg" class="muted"></span>
      </div>
      <div id="pvSourceBar" class="cmctl hidden">
        <button id="cmCopy" class="btn-primary">Copy ChordMark</button>
        <button id="cmDownload" class="tab">Download .chordmark</button>
        <span id="cmCopyMsg" class="muted"></span>
        <span class="muted">generated source of the CURRENT (unsaved) edits</span>
      </div>
      <div id="pvSplit" class="cmsplit">
        <textarea id="cmSource" class="hidden" readonly spellcheck="false"></textarea>
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
    <div id="json" class="hidden">
      <div class="row">
        <button id="jsonApply" class="btn-primary">Apply to model</button>
        <button id="jsonReload" class="tab">Reload from model</button>
        <button id="jsonFormat" class="tab">Format</button>
        <span id="jsonMsg" class="muted"></span>
      </div>
      <div id="jsonEditor"></div>
      <textarea id="jsonSource" spellcheck="false" class="hidden"></textarea>
    </div>
  </div>
</div>
<aside class="editor" id="editor"></aside>
<script src="vendor/tonal.bundle.js"></script>
<script src="vendor/chord-symbol.bundle.js"></script>
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/javascript.min.js"></script>
<script src="vendor/codemirror/lint.min.js"></script>
<script src="vendor/codemirror/matchbrackets.min.js"></script>
<script src="vendor/codemirror/closebrackets.min.js"></script>
<script src="doc_ops.js"></script>
<script src="chord_naming.js"></script>
<script src="fretboard.js"></script>
<script src="diagram.js"></script>
<script src="chord_dictionary.js"></script>
<script src="harmony.js"></script>
<!-- app_* split: core first (state/undo globals), entry (app.js) last -->
<script src="app_core.js"></script>
<script src="app_songs.js"></script>
<script src="app_bars.js"></script>
<script src="app_lyrics.js"></script>
<script src="app_views.js"></script>
<script src="app_dict.js"></script>
<script src="app.js"></script>
</body>
</html>
